services:
  xoai-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xoai-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ${XOAI_STORAGE}:/app/storage
      - sandbox_spool:/app/storage/_sandbox_spool
    command: xoai start --port 8080 --host 0.0.0.0
    depends_on:
      - xoai-mongo
      - xoai-redis

  xoai-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xoai-frontend
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      - xoai-backend

  xoai-mongo:
    image: mongo:7-jammy
    container_name: xoai-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  xoai-redis:
    image: redis:7-alpine
    container_name: xoai-redis
    restart: unless-stopped

  # --- Titan: Sandbox Runner (Zero-Trust Code Execution) ---
  sandbox-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xoai-sandbox
    restart: unless-stopped
    profiles:
      - sandbox
    network_mode: none
    read_only: true
    tmpfs:
      - /sandbox/scratch:size=256m,noexec=false
      - /tmp:size=64m
    environment:
      - SANDBOX_SPOOL=/sandbox/spool
      - SANDBOX_SCRATCH=/sandbox/scratch
    volumes:
      - sandbox_spool:/sandbox/spool
    command: python -m xoai.sandbox.runner
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0

  # --- Titan: Sandbox Runner with Allowlisted Egress ---
  sandbox-runner-egress:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xoai-sandbox-egress
    restart: unless-stopped
    profiles:
      - sandbox
    read_only: true
    tmpfs:
      - /sandbox/scratch:size=256m,noexec=false
      - /tmp:size=64m
    environment:
      - SANDBOX_SPOOL=/sandbox/spool
      - SANDBOX_SCRATCH=/sandbox/scratch
    volumes:
      - sandbox_spool:/sandbox/spool
    command: python -m xoai.sandbox.runner
    networks:
      - sandbox-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    dns:
      - 1.1.1.1
      - 8.8.8.8

  # --- Titan: Qdrant Vector Database ---
  xoai-qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: xoai-qdrant
    restart: unless-stopped
    profiles:
      - vector
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  sandbox_spool:
  qdrant_data:

networks:
  sandbox-egress:
    driver: bridge
    internal: false
